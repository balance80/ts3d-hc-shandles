<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="user-scalable=no" />
    <title>Web Viewer Desktop</title>

    <!-- Dependencies used by the legacy sample UI -->
    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script src="js/jquery.ui.touch-punch.min.js"></script>
    <script src="js/keymaster.min.js"></script>
    <script src="js/iscroll.min.js"></script>
    <script src="js/mobile-detect.min.js"></script>
    <script src="js/jquery.minicolors.min.js"></script>
    <script src="js/goldenlayout.min.js"></script>

    <!-- New HOOPS viewer (IIFE build = global Communicator).
       Put engine.esm.wasm in the same folder and keep this id so sample.js can infer enginePath. -->
    <script src="js/hwv/hoops-web-viewer-monolith.iife.js" id="hwvScript"></script>
    <!-- <script src="dist/hcSHandles.iife.min.js"></script> -->

    <!-- Alias for older code that still references Communicator.Operator.* -->
    <script>
      if (window.Communicator && !window.Communicator.Operator && window.Communicator.Operators) {
        window.Communicator.Operator = window.Communicator.Operators;
      }
    </script>

    <!-- Legacy sample UI from HC (still works with the IIFE build) -->
    <script src="js/web_viewer_ui.js"></script>

    <!-- Your app files -->
    <script src="js/sample.js"></script>
    <script src="js/app/startup.js"></script>
    <script src="js/app/ViewerUtility.js"></script>

    <!-- Your handles (ESM). If you prefer the global/IIFE bundle, include that instead. -->
    <script type="module">
      import * as hcSHandles from './js/hcSHandles/hcSHandles.js';
      window.shandles = hcSHandles;

      // Optional: make MobileDetect available if your code uses it
      window.md = new MobileDetect(window.navigator.userAgent);

      window.onload = function () {
        Sample.createViewer().then(
          function (viewer) {
            startup(viewer);

            window.onresize = function (event) {
              // jQuery resizable triggers onresize, guard against element-originated events
              if (typeof event.target.getAttribute !== 'function') {
                viewer.resizeCanvas();
              }
            };

            const uiConfig = {
              containerId: 'content',
              screenConfiguration: Sample.screenConfiguration,
              showModelBrowser: true,
              showToolbar: true,
            };

            window.ui = new Communicator.Ui.Desktop.DesktopUi(viewer, uiConfig);

            viewer.setCallbacks({
              modelStructureReady: msready,
            });

            viewer.start();
          },
          function (errorReason) {
            const errorDialog = new Communicator.Ui.UiDialog('content');
            errorDialog.setTitle('Viewer Error');
            errorDialog.setText(errorReason);
            errorDialog.show();
          }
        );
      };
    </script>

    <!-- Styles used by the legacy UI (keep what you actually use) -->
    <link rel="stylesheet" href="css/TreeControl.css" />
    <link rel="stylesheet" href="css/Toolbar.css" />
    <link rel="stylesheet" href="css/Common.css" />
    <link rel="stylesheet" href="css/Desktop.css" />
    <link rel="stylesheet" href="css/Mobile.css" />
    <link rel="stylesheet" href="css/NoteText.css" />
    <link rel="stylesheet" href="css/jquery-ui.min.css" />
    <link rel="stylesheet" href="css/PropertyWindow.css" />
    <link rel="stylesheet" href="css/ViewerSettings.css" />
    <link rel="stylesheet" href="css/jquery.minicolors.css" />
    <link rel="stylesheet" href="css/extra.css" />
    <link rel="stylesheet" href="css/goldenlayout-base.css" />
    <link rel="stylesheet" href="css/goldenlayout-light-theme.css" />
    <link rel="stylesheet" href="css/Relationships.css" />
  </head>

  <body>
    <div id="content">
      <div id="viewerContainer"></div>

      <!-- Toolbar HTML (unchanged) -->
      <div id="toolBar">
        <div class="toolbar-tools">
          <div id="home-button" title="Reset Camera" data-operatorclass="toolbar-home" class="hoops-tool">
            <div class="tool-icon"></div>
          </div>
          <div id="tool_separator_1" class="tool-separator"></div>
          <div
            id="view-button"
            title="Camera Menu"
            data-operatorclass="toolbar-camera"
            data-submenu="view-submenu"
            class="hoops-tool toolbar-menu"
          >
            <div class="tool-icon"></div>
          </div>
          <div
            id="edgeface-button"
            title="Wireframe on Shaded"
            data-operatorclass="toolbar-wireframeshaded"
            data-submenu="edgeface-submenu"
            class="hoops-tool toolbar-menu"
          >
            <div class="tool-icon"></div>
          </div>
          <div id="tool_separator_2" class="tool-separator"></div>
          <div
            id="redline-button"
            title="Redline Note"
            data-operatorclass="toolbar-redline-note"
            data-submenu="redline-submenu"
            class="hoops-tool toolbar-radio"
          >
            <div class="smarrow"></div>
            <div class="tool-icon"></div>
          </div>
          <div
            id="click-button"
            title="Select"
            data-operatorclass="toolbar-select"
            data-submenu="click-submenu"
            class="hoops-tool toolbar-radio active-tool"
          >
            <div class="smarrow"></div>
            <div class="tool-icon"></div>
          </div>
          <div
            id="camera-button"
            title="Orbit Camera"
            data-operatorclass="toolbar-orbit"
            data-submenu="camera-submenu"
            class="hoops-tool toolbar-menu"
          >
            <div class="tool-icon"></div>
          </div>
          <div id="tool_separator_3" class="tool-separator"></div>
          <div
            id="explode-button"
            title="Explode Menu"
            data-operatorclass="toolbar-explode"
            data-submenu="explode-slider"
            class="hoops-tool toolbar-menu-toggle"
          >
            <div class="tool-icon"></div>
          </div>
          <div
            id="cuttingplane-button"
            title="Cutting Plane Menu"
            data-operatorclass="toolbar-cuttingplane"
            data-submenu="cuttingplane-submenu"
            class="hoops-tool toolbar-menu-toggle"
          >
            <div class="tool-icon"></div>
          </div>
          <div id="tool_separator_4" class="tool-separator"></div>
          <div id="snapshot-button" title="Snapshot" data-operatorclass="toolbar-snapshot" class="hoops-tool">
            <div class="tool-icon"></div>
          </div>
          <div id="settings-button" title="Settings" data-operatorclass="toolbar-settings" class="hoops-tool">
            <div class="tool-icon"></div>
          </div>
        </div>

        <!-- submenus (unchanged) -->
        <div id="submenus">
          <!-- redline submenu -->
          <div id="redline-submenu" data-button="redline-button" class="toolbar-submenu submenus">
            <table>
              <tr>
                <td>
                  <div
                    id="redline-circle-button"
                    title="Redline Circle"
                    data-operatorclass="toolbar-redline-circle"
                    class="submenu-icon"
                  ></div>
                </td>
                <td>
                  <div
                    id="redline-rectangle-button"
                    title="Redline Rectangle"
                    data-operatorclass="toolbar-redline-rectangle"
                    class="submenu-icon"
                  ></div>
                </td>
              </tr>
              <tr>
                <td><div id="redline-note" title="Redline Note" data-operatorclass="toolbar-redline-note" class="submenu-icon"></div></td>
                <td>
                  <div
                    id="redline-freehand"
                    title="Redline Freehand"
                    data-operatorclass="toolbar-redline-freehand"
                    class="submenu-icon"
                  ></div>
                </td>
              </tr>
            </table>
          </div>

          <!-- camera submenu -->
          <div id="camera-submenu" data-button="camera-button" class="toolbar-submenu submenus">
            <table>
              <tr>
                <td><div id="operator-camera-walk" title="Walk" data-operatorclass="toolbar-walk" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td>
                  <div id="operator-camera-turntable" title="Turntable" data-operatorclass="toolbar-turntable" class="submenu-icon"></div>
                </td>
              </tr>
              <tr>
                <td><div id="operator-camera-orbit" title="Orbit Camera" data-operatorclass="toolbar-orbit" class="submenu-icon"></div></td>
              </tr>
            </table>
          </div>

          <!-- edgeface submenu -->
          <div id="edgeface-submenu" data-button="edgeface-button" class="toolbar-submenu submenus">
            <table>
              <tr>
                <td>
                  <div
                    id="viewport-wireframe-on-shaded"
                    title="Shaded With Lines"
                    data-operatorclass="toolbar-wireframeshaded"
                    class="submenu-icon"
                  ></div>
                </td>
              </tr>
              <tr>
                <td><div id="viewport-shaded" title="Shaded" data-operatorclass="toolbar-shaded" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td><div title="Hidden Line" data-operatorclass="toolbar-hidden-line" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td><div id="viewport-wireframe" title="Wireframe" data-operatorclass="toolbar-wireframe" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td><div id="viewport-xray" title="XRay" data-operatorclass="toolbar-xray" class="submenu-icon"></div></td>
              </tr>
            </table>
          </div>

          <!-- view submenu -->
          <div id="view-submenu" class="toolbar-submenu submenus">
            <table>
              <tr>
                <td>
                  <div
                    id="view-face"
                    title="Orient Camera To Selected Face"
                    data-operatorclass="toolbar-face"
                    class="submenu-icon disabled"
                  ></div>
                </td>
              </tr>
              <tr>
                <td><div id="view-iso" title="Iso View" data-operatorclass="toolbar-iso" class="submenu-icon"></div></td>
                <td><div id="view-ortho" title="Orthographic Projection" data-operatorclass="toolbar-ortho" class="submenu-icon"></div></td>
                <td><div id="view-persp" title="Perspective Projection" data-operatorclass="toolbar-persp" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td><div id="view-left" title="Left View" data-operatorclass="toolbar-left" class="submenu-icon"></div></td>
                <td><div id="view-right" title="Right View" data-operatorclass="toolbar-right" class="submenu-icon"></div></td>
                <td><div id="view-bottom" title="Bottom View" data-operatorclass="toolbar-bottom" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td><div id="view-front" title="Front View" data-operatorclass="toolbar-front" class="submenu-icon"></div></td>
                <td><div id="view-back" title="Back View" data-operatorclass="toolbar-back" class="submenu-icon"></div></td>
                <td><div id="view-top" title="Top View" data-operatorclass="toolbar-top" class="submenu-icon"></div></td>
              </tr>
            </table>
          </div>

          <!-- click submenu -->
          <div id="click-submenu" data-button="click-button" class="toolbar-submenu submenus">
            <table>
              <tr>
                <td><div id="note-button" title="Create Note-Pin" data-operatorclass="toolbar-note" class="submenu-icon"></div></td>
              </tr>
              <tr>
                <td>
                  <div
                    id="measure-angle-between-faces"
                    title="Measure Angle Between Faces"
                    data-operatorclass="toolbar-measure-angle"
                    class="submenu-icon"
                  ></div>
                </td>
                <td>
                  <div
                    id="measure-distance-between-faces"
                    title="Measure Distance Between Faces"
                    data-operatorclass="toolbar-measure-distance"
                    class="submenu-icon"
                  ></div>
                </td>
              </tr>
              <tr>
                <td><div id="measure-edges" title="Measure Edges" data-operatorclass="toolbar-measure-edge" class="submenu-icon"></div></td>
                <td>
                  <div
                    id="measure-point-to-point"
                    title="Measure Point to Point"
                    data-operatorclass="toolbar-measure-point"
                    class="submenu-icon"
                  ></div>
                </td>
              </tr>
              <tr>
                <td><div id="select-parts" title="Select Parts" data-operatorclass="toolbar-select" class="submenu-icon"></div></td>
                <td><div id="area-select" title="Area Select" data-operatorclass="toolbar-area-select" class="submenu-icon"></div></td>
              </tr>
            </table>
          </div>

          <!-- explode slider -->
          <div id="explode-slider" class="toolbar-submenu slider-menu submenus">
            <div id="explosion-slider" style="height: 90px" class="toolbar-slider"></div>
          </div>

          <!-- cutting plane submenu -->
          <div id="cuttingplane-submenu" class="toolbar-submenu cutting-plane submenus no-modal">
            <table>
              <tr>
                <td>
                  <div
                    id="cuttingplane-face"
                    title="Create Cutting Plane On Selected Face"
                    data-plane="face"
                    data-operatorclass="toolbar-cuttingplane-face"
                    class="toolbar-cp-plane submenu-icon disabled"
                  ></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div
                    id="cuttingplane-x"
                    title="Cutting Plane X"
                    data-plane="x"
                    data-operatorclass="toolbar-cuttingplane-x"
                    class="toolbar-cp-plane submenu-icon"
                  ></div>
                </td>
                <td>
                  <div
                    id="cuttingplane-section"
                    title="Cutting Plane Visibility Toggle"
                    data-plane="section"
                    data-operatorclass="toolbar-cuttingplane-section"
                    class="toolbar-cp-plane submenu-icon disabled"
                  ></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div
                    id="cuttingplane-y"
                    title="Cutting Plane Y"
                    data-plane="y"
                    data-operatorclass="toolbar-cuttingplane-y"
                    class="toolbar-cp-plane submenu-icon"
                  ></div>
                </td>
                <td>
                  <div
                    id="cuttingplane-toggle"
                    title="Cutting Plane Section Toggle"
                    data-plane="toggle"
                    data-operatorclass="toolbar-cuttingplane-toggle"
                    class="toolbar-cp-plane submenu-icon disabled"
                  ></div>
                </td>
              </tr>
              <tr>
                <td>
                  <div
                    id="cuttingplane-z"
                    title="Cutting Plane Z"
                    data-plane="z"
                    data-operatorclass="toolbar-cuttingplane-z"
                    class="toolbar-cp-plane submenu-icon"
                  ></div>
                </td>
                <td>
                  <div
                    id="cuttingplane-reset"
                    title="Cutting Plane Reset"
                    data-plane="reset"
                    data-operatorclass="toolbar-cuttingplane-reset"
                    class="toolbar-cp-plane submenu-icon disabled"
                  ></div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <!-- settings dialog and the rest of your markup (unchanged) -->
      <div id="viewer-settings-dialog-container">
        <!-- … keep your existing settings dialog markup … -->
      </div>

      <div id="snapshot-dialog" class="hoops-ui-window">
        <div class="hoops-ui-window-header">Snapshot</div>
        <div class="hoops-ui-window-body">
          <img id="snapshot-dialog-image" class="snapshot-image" alt="Snapshot" />
          <div class="snapshot-text">Right Click to Save image</div>
        </div>
        <div class="hoops-ui-window-footer">
          <div class="hoops-ui-footer-buttons">
            <button id="snapshot-dialog-cancel-button">Close</button>
          </div>
        </div>
      </div>

      <div id="settingsdiv" style="width: 100%; height: 100%; position: relative; font-size: 12px">
        <h1>Settings</h1>
        <input type="checkbox" id="relativecheck" onclick="toggleRelative()" checked />Relatve Handles<br />
        <input type="checkbox" id="useselectionpositioncheck" onclick="toggleUseSelectionPosition()" />Place Handles at Selection
        Position<br />
        <input type="checkbox" id="translatesnapcheck" onclick="toggleEnableTranslateSnapping()" />Enable Translate Snap
        <input type="text" id="translateSnappingEdit" onchange="toggleEnableTranslateSnapping()" style="width: 50px" value="10" /><br />
        <input type="checkbox" id="rotatesnapcheck" onclick="toggleEnableRotateSnapping()" />Enable Rotate Snap
        <input type="text" id="rotateSnappingEdit" onchange="toggleEnableRotateSnapping()" style="width: 50px" value="30" /><br />
        <span style="margin-left: 5px">Handle Size:</span>
        <input onchange="handleScaleEditChange()" type="text" id="handleScaleEdit" style="width: 30px" value="1" />
        <h1>Insert 2D-handles</h1>
        <input type="button" class="button-4" onclick="showRotateHandlesFromSelection([])" value="Rotate" />
        <input
          type="button"
          class="button-4"
          onclick="showTranslateHandlesFromSelection([Communicator.Axis.X, Communicator.Axis.Y])"
          value="Translate"
        />
        <input
          type="button"
          class="button-4"
          onclick="showScaleHandlesFromSelection([Communicator.Axis.X, Communicator.Axis.Y])"
          value="Scale"
        /><br />
        <h1>Insert 3D-handles</h1>
        <input type="button" class="button-4" onclick="showRotateHandlesFromSelection()" value="Rotate" />
        <input type="button" class="button-4" onclick="showTranslateHandlesFromSelection()" value="Translate" />
        <input type="button" class="button-4" onclick="showScaleHandlesFromSelection()" value="Scale" /><br />
        <h1>Misc</h1>
        <input type="button" class="button-4" onclick="drawTriangle()" value="Draw triangle" />
        <input type="button" class="button-4" onclick="refreshHandles()" value="Refresh" /><br />
        <h1>Undo/Redo</h1>
        <input type="button" class="button-4" onclick="undo()" value="Undo" />
        <input type="button" class="button-4" onclick="redo()" value="Redo" /><br />
      </div>
    </div>
  </body>
</html>
